auth_enabled: false

server:
  http_listen_port: 3100

common:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
  replication_factor: 1
  path_prefix: /loki

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki/chunks

limits_config:
  # How long logs are kept
  retention_period: 30d
  # Max size of a single label value — protects against cardinality explosion
  max_label_value_length: 2048

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
